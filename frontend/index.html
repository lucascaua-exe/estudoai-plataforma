    />

      content="Questões, simulados, streak e assistente IA para Analista de TI — Araguaína/TO 2026."
    />
    <meta property="og:locale" content="pt_BR" />
    <title>EstudoAI — Estudo gamificado</title>
    <!-- Mata SW/cache antigos ANTES do app (evita tela branca pós-deploy) -->
    <script>
      ;(function () {
        var KEY = 'estudoai.sw-kill-v1'
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.unregister()
              })
            })
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k)
              })
            })
          }
          if (!sessionStorage.getItem(KEY) && 'serviceWorker' in navigator) {
            sessionStorage.setItem(KEY, '1')
          }
        } catch (e) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          var ua = navigator.userAgent || ''
          var mobile =
            window.matchMedia('(max-width: 1023px)').matches ||
            window.matchMedia('(pointer: coarse)').matches ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(ua)
          var manual = localStorage.getItem('estudoai-theme-manual') === '1'
          var stored = localStorage.getItem('estudoai-theme')
          var theme = 'light'
          if (mobile) {
            theme = manual && (stored === 'dark' || stored === 'light') ? stored : 'light'
            if (!manual) localStorage.setItem('estudoai-theme', 'light')
          } else if (stored === 'dark' || stored === 'light') {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          else root.classList.remove('dark')
          root.style.colorScheme = theme
          root.setAttribute('data-theme', theme)
          var metaScheme = document.querySelector('meta[name="color-scheme"]')
          if (metaScheme) metaScheme.setAttribute('content', theme)
          var metaColor = document.querySelector('meta[name="theme-color"]')
          if (metaColor) metaColor.setAttribute('content', theme === 'dark' ? '#0B1424' : '#F4F7FC')
        } catch (e) {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

      >
