<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="EstudoAI — prepare-se para Analista de TI Araguaína/TO 2026 com questões, XP, streak e revisão inteligente."
    />
    <meta name="theme-color" content="#F7F5F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EstudoAI" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EstudoAI — Estudo gamificado para concursos" />
    <meta
      property="og:description"
      content="Questões, simulados, streak e assistente IA para Analista de TI — Araguaína/TO 2026."
    />
    <meta property="og:locale" content="pt_BR" />
    <title>EstudoAI — Estudo gamificado</title>
    <script>
      ;(function () {
        try {
          var ua = navigator.userAgent || ''
          var mobile =
            window.matchMedia('(max-width: 1023px)').matches ||
            window.matchMedia('(pointer: coarse)').matches ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(ua)
          var manual = localStorage.getItem('estudoai-theme-manual') === '1'
          var stored = localStorage.getItem('estudoai-theme')
          var theme = 'light'
          if (mobile) {
            // Mobile: light por padrão; ignora dark antigo salvo sem escolha manual
            theme = manual && (stored === 'dark' || stored === 'light') ? stored : 'light'
            if (!manual) localStorage.setItem('estudoai-theme', 'light')
          } else if (stored === 'dark' || stored === 'light') {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          else root.classList.remove('dark')
          root.style.colorScheme = theme
          root.setAttribute('data-theme', theme)
          var metaScheme = document.querySelector('meta[name="color-scheme"]')
          if (metaScheme) metaScheme.setAttribute('content', theme)
          var metaColor = document.querySelector('meta[name="theme-color"]')
          if (metaColor) metaColor.setAttribute('content', theme === 'dark' ? '#1c1917' : '#F7F5F2')
        } catch (e) {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div
        style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F7F5F2;color:#9A3412;font-family:system-ui,sans-serif"
      >
        Carregando EstudoAI…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
