<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="EstudoAI — prepare-se para Analista de TI Araguaína/TO 2026 com questões, XP, streak e revisão inteligente."
    />
    <meta name="theme-color" content="#9A3412" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EstudoAI" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EstudoAI — Estudo gamificado para concursos" />
    <meta
      property="og:description"
      content="Questões, simulados, streak e assistente IA para Analista de TI — Araguaína/TO 2026."
    />
    <meta property="og:locale" content="pt_BR" />
    <title>EstudoAI — Estudo gamificado</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('estudoai-theme')
          var mobile =
            window.matchMedia('(max-width: 1023px)').matches ||
            window.matchMedia('(pointer: coarse)').matches
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : mobile
                ? 'light'
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          else document.documentElement.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
